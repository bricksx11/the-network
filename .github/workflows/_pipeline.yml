name: pipeline

# Reusable workflow -- both daily-post.yml (cron) and dispatch-post.yml (shortcut trigger)
# call this. Matrix over niches; currently just Barber (the only niche with a populated
# image library) -- add more entries here as new niches are provisioned, per the plan's
# "adding a niche is mostly config, not new code."
on:
  workflow_call:
    inputs:
      scope:
        description: "Which niches to run. 'all' or a specific niche name."
        required: false
        type: string
        default: "all"

jobs:
  run-niche:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed for the "Commit run log" step's git push -- repo's default
      # GITHUB_TOKEN permission is read-only, confirmed via a real failed run, not assumed
    strategy:
      fail-fast: false
      matrix:
        niche: [Barber]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        # ubuntu-latest runners don't ship ffmpeg pre-installed (confirmed via a real failed
        # run, not assumed -- checked against the runner image's own software list too)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip niche if scope doesn't match
        if: inputs.scope != 'all' && inputs.scope != matrix.niche
        run: echo "Scope '${{ inputs.scope }}' does not include ${{ matrix.niche }}, skipping." && exit 0

      - name: Run pipeline for ${{ matrix.niche }}
        if: inputs.scope == 'all' || inputs.scope == matrix.niche
        env:
          # GitHub Actions' secrets context does not support dynamic/computed keys
          # (secrets[matrix.niche] is unsupported) -- so every niche's credential secret
          # is listed explicitly here, and src/credentials.py picks the right one at
          # runtime by constructing NICHE_CREDS__<NICHE> from the niche name in Python,
          # which has no such restriction. Add one line per niche as they're provisioned.
          NICHE_CREDS__BARBER: ${{ secrets.NICHE_CREDS__BARBER }}
        run: python -m src.orchestrator ${{ matrix.niche }}

      - name: Commit run log
        if: always()
        run: |
          git config user.name "the-network-bot"
          git config user.email "the-network-bot@users.noreply.github.com"
          # logs/ may not exist yet if the pipeline step failed before writing one
          # (e.g. missing credentials) -- mkdir -p makes `git add` safe either way.
          mkdir -p logs
          git add logs/
          git diff --cached --quiet || git commit -m "run log: ${{ matrix.niche }} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
